services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: biyoai
      POSTGRES_PASSWORD: biyoai
      POSTGRES_DB: biyoai
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./lib/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biyoai"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgres://biyoai:biyoai@db:5432/biyoai
      # Extra CA for networks that inspect HTTPS (see certs/README.md). If the
      # file does not exist Node only prints a warning at startup.
      NODE_EXTRA_CA_CERTS: /certs/extra-ca.pem
      # Embeddings run in the embeddings service below (see OPERATIONS.md). These
      # override .env so the same .env also works for scripts run on the host.
      EMBED_BASE_URL: http://embeddings:80/v1
      EMBED_MODEL: intfloat/multilingual-e5-base
      # e5 models need these prefixes to tell questions from passages.
      EMBED_QUERY_PREFIX: "query: "
      EMBED_DOCUMENT_PREFIX: "passage: "
    volumes:
      - ./certs:/certs:ro
    ports:
      - "3000:3000"

  # Embeddings (turning text into vectors for search) run here, on the school
  # PC, so source and question text does not leave it for that step.
  # multilingual-e5-base: understands Turkish and outputs 768 dimensions, the
  # width of the database column. The model is downloaded from Hugging Face on
  # first start and kept in the embeddings_data volume.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    restart: unless-stopped
    command: ["--model-id", "intfloat/multilingual-e5-base"]
    environment:
      # Extra CA for networks that inspect HTTPS (see certs/README.md); needed
      # to download the model there.
      SSL_CERT_FILE: /certs/extra-ca.pem
    volumes:
      - embeddings_data:/data
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8080:80"

volumes:
  db_data:
  embeddings_data:
