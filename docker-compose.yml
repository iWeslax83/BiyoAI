services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: biyoai
      POSTGRES_PASSWORD: biyoai
      POSTGRES_DB: biyoai
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./lib/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biyoai"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://biyoai:biyoai@db:5432/biyoai
      # Extra CA for networks that inspect HTTPS (see certs/README.md). If the
      # file does not exist Node only prints a warning at startup.
      NODE_EXTRA_CA_CERTS: /certs/extra-ca.pem
    volumes:
      - ./certs:/certs:ro
    ports:
      - "3000:3000"

  # Optional: runs embeddings on the school PC so question text never leaves
  # it for that step. Start with: docker compose --profile local-embeddings up -d
  # then pull the model once (see OPERATIONS.md) and set EMBED_BASE_URL and
  # EMBED_MODEL in .env.
  ollama:
    image: ollama/ollama
    profiles: ["local-embeddings"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
  ollama_data:
