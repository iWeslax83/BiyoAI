services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: biyoai
      POSTGRES_PASSWORD: biyoai
      POSTGRES_DB: biyoai
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./lib/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biyoai"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgres://biyoai:biyoai@db:5432/biyoai
      # Extra CA for networks that inspect HTTPS (see certs/README.md). If the
      # file does not exist Node only prints a warning at startup.
      NODE_EXTRA_CA_CERTS: /certs/extra-ca.pem
      # Embeddings run in the ollama service below (see OPERATIONS.md). These
      # override .env so the same .env also works for scripts run on the host.
      EMBED_BASE_URL: http://ollama:11434/v1
      EMBED_MODEL: nomic-embed-text
    volumes:
      - ./certs:/certs:ro
    ports:
      - "3000:3000"

  # Embeddings (turning text into vectors for search) run here, on the school
  # PC, so source and question text does not leave it for that step.
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      # Extra CA for networks that inspect HTTPS (see certs/README.md); needed
      # to download the model.
      SSL_CERT_FILE: /certs/extra-ca.pem
    volumes:
      - ollama_data:/root/.ollama
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:11434:11434"

  # Downloads the embedding model once; the model is kept in the ollama_data
  # volume afterwards.
  ollama-init:
    image: ollama/ollama
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - sh
      - -c
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull nomic-embed-text

volumes:
  db_data:
  ollama_data:
